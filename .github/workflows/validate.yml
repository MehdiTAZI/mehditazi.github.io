name: Validate multilingual website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Check committed static pages match their sources
        run: git diff --exit-code -- index.html ventures.html perspectives.html fr/ sitemap.xml data/travel-albums.js js/locales/
